name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-test:
    name: Go test (client + shared)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: |
            client/go.sum
            shared/go.sum

      # Linux WebKit deps for Wails — only needed if we ever build the
      # full Wails binary in CI. Tests don't need them, so skip on macOS.
      - name: Install Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev || \
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Test shared/
        working-directory: ./shared
        run: go test -race -count=1 ./...

      - name: Test client/
        working-directory: ./client
        run: go test -race -count=1 ./...

  go-vet:
    name: Go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: client/go.sum

      - name: Install Linux WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev || \
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Vet shared
        working-directory: ./shared
        run: go vet ./...

      - name: Vet client
        working-directory: ./client
        run: go vet ./...

  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/frontend/package-lock.json

      - name: Install
        working-directory: ./client/frontend
        run: npm ci

      - name: Type-check + build
        working-directory: ./client/frontend
        run: npm run build
