name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0-rc1)"
        required: true

permissions:
  contents: write   # need write to upload release assets

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runs-on: macos-14         # Apple silicon runner
            wails-platform: darwin/arm64
            artifact-glob: "build/bin/Portal.app"
            artifact-name: "Portal-{tag}-darwin-arm64.zip"
          - target: darwin-amd64
            runs-on: macos-13         # Intel runner
            wails-platform: darwin/amd64
            artifact-glob: "build/bin/Portal.app"
            artifact-name: "Portal-{tag}-darwin-amd64.zip"
          - target: linux-amd64
            runs-on: ubuntu-22.04
            wails-platform: linux/amd64
            artifact-glob: "build/bin/Portal"
            artifact-name: "Portal-{tag}-linux-amd64.tar.gz"
          - target: windows-amd64
            runs-on: windows-2022
            wails-platform: windows/amd64
            artifact-glob: "build/bin/Portal.exe"
            artifact-name: "Portal-{tag}-windows-amd64.zip"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: client/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/frontend/package-lock.json

      # Install Wails CLI.
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # Linux WebKit deps.
      - name: Install Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev || \
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # Frontend deps.
      - name: Install frontend deps
        working-directory: ./client/frontend
        run: npm ci

      # Build via Wails.
      - name: Wails build
        working-directory: ./client
        shell: bash
        run: wails build -clean -platform "${{ matrix.wails-platform }}"

      # Resolve tag for artifact naming.
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # Package per-OS.
      - name: Package macOS .app
        if: runner.os == 'macOS'
        working-directory: ./client
        shell: bash
        run: |
          NAME="Portal-${{ steps.tag.outputs.tag }}-${{ matrix.target }}.zip"
          (cd build/bin && zip -r -y "../../$NAME" Portal.app)
          echo "ARTIFACT_PATH=client/$NAME" >> $GITHUB_ENV

      - name: Package Linux binary
        if: runner.os == 'Linux'
        working-directory: ./client
        shell: bash
        run: |
          NAME="Portal-${{ steps.tag.outputs.tag }}-${{ matrix.target }}.tar.gz"
          (cd build/bin && tar -czf "../../$NAME" Portal)
          echo "ARTIFACT_PATH=client/$NAME" >> $GITHUB_ENV

      - name: Package Windows binary
        if: runner.os == 'Windows'
        working-directory: ./client
        shell: bash
        run: |
          NAME="Portal-${{ steps.tag.outputs.tag }}-${{ matrix.target }}.zip"
          powershell -Command "Compress-Archive -Path build/bin/Portal.exe -DestinationPath ../$NAME"
          echo "ARTIFACT_PATH=$NAME" >> $GITHUB_ENV

      # ---------------------------------------------------------------
      # Code signing — gated behind secrets being present so this
      # workflow runs on forks too. When the maintainer adds the secrets,
      # signing automatically activates.
      # ---------------------------------------------------------------
      - name: Sign macOS .app (when secrets present)
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        shell: bash
        run: |
          # Decode .p12 cert and add to keychain
          echo "$APPLE_DEVELOPER_ID_CERT" | base64 -d > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" build.keychain

          # Sign the .app
          codesign --deep --force --options runtime \
            --sign "Developer ID Application: $APPLE_TEAM_ID" \
            client/build/bin/Portal.app

          # Notarize
          xcrun notarytool submit "client/$NAME" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun stapler staple client/build/bin/Portal.app

          # Repackage with the staple
          (cd client/build/bin && zip -r -y "../../$NAME" Portal.app)
          echo "ARTIFACT_PATH=client/$NAME" >> $GITHUB_ENV

      - name: Sign Windows .exe (when secrets present)
        if: runner.os == 'Windows' && env.WINDOWS_CERT != ''
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $cert = [System.Convert]::FromBase64String($env:WINDOWS_CERT)
          [System.IO.File]::WriteAllBytes("$env:TEMP\cert.pfx", $cert)
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          & $signtool sign /f "$env:TEMP\cert.pfx" /p "$env:WINDOWS_CERT_PASSWORD" `
            /tr http://timestamp.sectigo.com /td sha256 /fd sha256 `
            client\build\bin\Portal.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARTIFACT_PATH }}
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Portal ${{ steps.tag.outputs.tag }}
          body_path: .github/release_body.md
          draft: true
          prerelease: ${{ contains(steps.tag.outputs.tag, '-rc') || contains(steps.tag.outputs.tag, '-beta') }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
