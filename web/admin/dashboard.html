<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portal — Dashboard</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
<link href="https://fonts.bunny.net/css?family=inter:400,500,600,700,800|jetbrains-mono:400,500,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/admin.css?v=0.5.8" />
</head>
<body>

<div class="dash-shell">
  <div class="topbar">
    <a class="brand" href="/"><span class="logo"></span><span>Portal</span></a>
    <div class="right" id="topRight">
      <span id="langSlot"></span>
      <span class="divider"></span>
      <button class="icon-btn danger" id="signoutBtn" title="Sign out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
      <span class="divider"></span>
      <span class="user-chip" id="userChip">
        <span class="avatar" id="avatar">?</span>
        <span id="usernameLbl">…</span>
      </span>
    </div>
  </div>

  <main class="dash-main">
    <h1 class="dash-greet"><span id="greetTxt">—</span>, <span class="gradient-text" id="greetName">—</span></h1>
    <p class="dash-sub" id="dashSub">—</p>

    <div class="section-title" id="devicesTitle">—</div>
    <div id="devicesBody"></div>

    <div class="section-title" id="portalsTitle">—</div>
    <div id="portalsBody"></div>

    <div class="alert info" id="note" style="display:none"></div>
  </main>
</div>

<script src="/admin/admin.js?v=0.5.8"></script>
<script>
(() => {
  const A = window.PortalAdmin;
  const $ = (id) => document.getElementById(id);

  let me = null;
  let devices = [];
  let portals = [];
  let serverNote = "";

  A.buildLangToggle($("langSlot"));

  // HTML escape helper — every value rendered into innerHTML must
  // pass through this. Server-side nicknames are validated to a safe
  // charset but we don't trust the wire anyway.
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // Human-friendly "N min ago". The server gives us connectedSecs
  // already so we don't fight clock skew between client and origin.
  function relTime(secs) {
    if (secs < 10) return A.t("time.justnow");
    if (secs < 60) return A.t("time.s").replace("{0}", String(secs));
    if (secs < 3600) return A.t("time.m").replace("{0}", String(Math.floor(secs / 60)));
    if (secs < 86400) return A.t("time.h").replace("{0}", String(Math.floor(secs / 3600)));
    return A.t("time.d").replace("{0}", String(Math.floor(secs / 86400)));
  }

  function paint() {
    document.title = A.t("title.dashboard");
    $("greetTxt").textContent     = A.t("dash.greeting");
    $("dashSub").textContent      = A.t("dash.subtitle");
    $("devicesTitle").textContent = A.t("dash.devices.title");
    $("portalsTitle").textContent = A.t("dash.portals.title");
    $("signoutBtn").title         = A.t("btn.signout");

    if (me) {
      $("greetName").textContent   = me.username;
      $("usernameLbl").textContent = me.username;
      $("avatar").textContent      = (me.username[0] || "?").toUpperCase();
    } else {
      $("greetName").textContent = "—";
      $("usernameLbl").textContent = "—";
      $("avatar").textContent = "?";
    }

    renderDevices();
    renderPortals();
  }
  A.onPaint(paint);

  function renderDevices() {
    const host = $("devicesBody");
    if (!devices.length) {
      host.innerHTML = `
        <div class="empty empty-cta">
          <strong>${esc(A.t("dash.devices.empty.h"))}</strong>
          <p>${esc(A.t("dash.devices.empty.p"))}</p>
          <a class="btn btn-primary" href="/#kirish">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            ${esc(A.t("dash.devices.download"))}
          </a>
        </div>`;
      return;
    }
    const items = devices.map((d) => {
      const nick = d.nickname || "—";
      const initial = (nick[0] || "?").toUpperCase();
      const status = d.portalId
        ? `${esc(A.t("dash.devices.inportal"))} <a href="#portal-${esc(d.portalId)}" class="device-portal-link">${esc(d.portalId)}</a>`
        : `<span class="muted">${esc(A.t("dash.devices.idle"))}</span>`;
      return `
        <div class="card-row device-row">
          <span class="avatar gradient-bg">${esc(initial)}</span>
          <div class="card-row-main">
            <div class="card-row-title">${esc(nick)}</div>
            <div class="card-row-meta">
              <span class="mono">ip:${esc(d.ipHashShort)}</span>
              · <span>${esc(relTime(d.connectedSecs))}</span>
              · ${status}
            </div>
          </div>
          <div class="card-row-actions">
            <button type="button" class="btn-mini danger device-signout" data-peer="${esc(d.peerId)}">
              ${esc(A.t("dash.devices.signout"))}
            </button>
          </div>
        </div>`;
    }).join("");
    host.innerHTML = `<div class="list">${items}</div>`;
  }

  function renderPortals() {
    const host = $("portalsBody");
    if (!portals.length) {
      host.innerHTML = `
        <div class="empty">
          <strong>${esc(A.t("dash.portals.empty.h"))}</strong>
          <p>${esc(A.t("dash.portals.empty.p"))}</p>
        </div>`;
    } else {
      const items = portals.map((p) => {
        const ownerNick = p.ownerNickname || "—";
        const initial = (ownerNick[0] || "?").toUpperCase();
        const youOrThey = p.isOwner ? esc(A.t("dash.portals.you")) : esc(ownerNick);
        const peerNote = `${p.peerCount} / ${p.capacity || 16} ${esc(A.t("dash.portals.members"))}`;
        const lockBadge = p.isLocked
          ? `<span class="pill-mini danger">${esc(A.t("dash.portals.locked"))}</span>`
          : "";
        const ownerBadge = p.isOwner
          ? `<span class="pill-mini accent">${esc(A.t("dash.portals.owner"))}</span>`
          : "";
        const codeRow = p.isOwner && p.code
          ? `<div class="code-row mono">${esc(A.t("dash.portals.code"))} <span class="code-value">${esc(p.code)}</span>
              <button type="button" class="copy-code-btn" data-code="${esc(p.code)}" aria-label="copy">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span class="copy-label">${esc(A.t("dash.copy.label"))}</span>
              </button>
             </div>`
          : "";
        const labelLine = p.label
          ? `<div class="card-row-label">${esc(p.label)}</div>`
          : "";

        // Members list with kick buttons (owner only).
        const members = (p.members || []).map((m) => {
          const tag = m.isSelf ? ` <span class="muted">(${esc(A.t("dash.portals.you"))})</span>` : "";
          const kickBtn = (p.isOwner && !m.isSelf)
            ? `<button type="button" class="btn-mini danger portal-kick" data-portal="${esc(p.portalId)}" data-peer="${esc(m.peerId)}" data-nick="${esc(m.nickname || "")}">${esc(A.t("dash.portals.kick"))}</button>`
            : "";
          return `<li><span class="mono">${esc(m.nickname || "—")}</span>${tag}${kickBtn}</li>`;
        }).join("");
        const membersBlock = members
          ? `<ul class="member-list">${members}</ul>`
          : "";

        const lockBtn = p.isOwner
          ? `<button type="button" class="btn-mini portal-lock" data-portal="${esc(p.portalId)}" data-locked="${p.isLocked ? "true" : "false"}">
              ${esc(p.isLocked ? A.t("dash.portals.unlock") : A.t("dash.portals.lock"))}
            </button>`
          : "";

        return `
          <div class="card-row portal-row" id="portal-${esc(p.portalId)}">
            <span class="avatar gradient-bg">${esc(initial)}</span>
            <div class="card-row-main">
              ${labelLine}
              <div class="card-row-title">
                <span class="mono">${esc(p.portalId)}</span>
                ${ownerBadge}${lockBadge}
              </div>
              <div class="card-row-meta">${youOrThey} · ${peerNote}</div>
              ${codeRow}
              ${membersBlock}
            </div>
            <div class="card-row-actions">${lockBtn}</div>
          </div>`;
      }).join("");
      host.innerHTML = `<div class="list">${items}</div>`;
    }

    if (serverNote) {
      $("note").style.display = "";
      $("note").textContent = serverNote;
    } else {
      $("note").style.display = "none";
    }
  }

  async function refresh() {
    try {
      const [d, ps] = await Promise.all([
        A.api("/api/devices").catch(() => ({ devices: [] })),
        A.api("/api/portals").catch(() => ({ portals: [] })),
      ]);
      devices = d?.devices || [];
      portals = ps?.portals || [];
      serverNote = ps?.note || "";
      renderDevices();
      renderPortals();
    } catch (_) { /* next tick will retry */ }
  }

  // 5-second poll; skip when tab is hidden to save the battery.
  let pollTimer = null;
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(() => { if (!document.hidden) refresh(); }, 5000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refresh();
    });
  }

  // ---------- delegated click handlers ----------
  document.addEventListener("click", async (ev) => {
    // Copy portal code.
    const copyBtn = ev.target.closest(".copy-code-btn");
    if (copyBtn) {
      const code = copyBtn.dataset.code || "";
      try {
        await navigator.clipboard.writeText(code);
        const lbl = copyBtn.querySelector(".copy-label");
        const old = lbl ? lbl.textContent : "";
        if (lbl) lbl.textContent = A.t("dash.copy.copied");
        copyBtn.classList.add("flash");
        setTimeout(() => {
          if (lbl) lbl.textContent = old;
          copyBtn.classList.remove("flash");
        }, 1400);
      } catch (_) { /* clipboard blocked — value stays user-selectable */ }
      return;
    }

    // Sign out a device.
    const sob = ev.target.closest(".device-signout");
    if (sob) {
      if (!confirm(A.t("dash.devices.signout.confirm"))) return;
      sob.disabled = true;
      try {
        await A.api("/api/devices/signout", { method: "POST", body: { peerId: sob.dataset.peer } });
        refresh();
      } catch (_) { sob.disabled = false; }
      return;
    }

    // Toggle lock.
    const lk = ev.target.closest(".portal-lock");
    if (lk) {
      const want = lk.dataset.locked !== "true"; // flip
      lk.disabled = true;
      try {
        await A.api("/api/portals/lock", { method: "POST", body: { portalId: lk.dataset.portal, locked: want } });
        refresh();
      } catch (_) { lk.disabled = false; }
      return;
    }

    // Kick member.
    const k = ev.target.closest(".portal-kick");
    if (k) {
      const nick = k.dataset.nick || k.dataset.peer;
      if (!confirm(A.t("dash.portals.kick.confirm").replace("{0}", nick))) return;
      k.disabled = true;
      try {
        await A.api("/api/portals/kick", { method: "POST", body: { portalId: k.dataset.portal, peerId: k.dataset.peer } });
        refresh();
      } catch (_) { k.disabled = false; }
      return;
    }
  });

  // Sign-out of the dashboard session.
  $("signoutBtn").addEventListener("click", async () => {
    try { await A.api("/api/auth/signout", { method: "POST" }); }
    catch (_) {}
    location.href = "/admin/login";
  });

  // Bootstrap.
  (async () => {
    try {
      me = await A.api("/api/me");
    } catch (_) {
      location.href = `/admin/login?next=${encodeURIComponent("/admin/dashboard")}`;
      return;
    }
    await refresh();
    paint();
    startPolling();
  })();
})();
</script>
</body>
</html>
