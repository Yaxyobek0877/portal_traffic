<?xml version="1.0" encoding="UTF-8"?>
<!--
  Portal app icon — static rasterizable form of the animated wormhole
  logo from client/frontend/src/components/Logo.tsx. The frontend
  motif is concentric dashed rings + a glowing centre node, painted
  with a violet→indigo→cyan gradient. We can't keep the spin /
  pulse animations in a built icon, so this snapshot picks ring
  rotations that still read as a wormhole at thumbnail scale.

  Canvas: 1024x1024 with a subtle radial backdrop so the icon has
  presence on light AND dark dock backgrounds. The viewBox stays
  0 0 200 200 internally so the math matches the React component.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="1024" height="1024">
  <defs>
    <!-- Stroke gradient — same stops as the React Logo. -->
    <linearGradient id="ringStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#8b5cf6"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <!-- Centre node glow. -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <!-- Background — dark navy with a subtle violet bloom in the
         centre so the icon doesn't read as a flat black square in
         the dock. The corners stay near-black to match the app
         shell's bg colour (#0a0e1a). -->
    <radialGradient id="bgBloom" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#1a1230" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#0d1322" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Rounded-square background. macOS will mask its own corners
       on top, but giving the icon its own rounded corners keeps it
       presentable on Windows and Linux taskbars too. -->
  <rect x="0" y="0" width="200" height="200" rx="44" ry="44" fill="url(#bgBloom)"/>

  <!-- Outer rings — each rotated to a non-zero angle so the dashed
       gaps don't all align at 0/90/180/270 (which would look like
       a pinwheel). Reverse-direction implied by the animation in
       the live logo is faked here by alternating phase. -->
  <g transform="translate(100,100)">
    <!-- r=92, dash 3/9, opacity .55, slight tilt -->
    <g transform="rotate(38)">
      <circle cx="0" cy="0" r="92" fill="none"
              stroke="url(#ringStroke)" stroke-width="1.4"
              stroke-dasharray="3 9" opacity="0.55"/>
    </g>
    <!-- r=78, dash 6/4, opacity .7 -->
    <g transform="rotate(-15)">
      <circle cx="0" cy="0" r="78" fill="none"
              stroke="url(#ringStroke)" stroke-width="1.6"
              stroke-dasharray="6 4" opacity="0.7"/>
    </g>
    <!-- r=62, dash 2/6, opacity .82 -->
    <g transform="rotate(72)">
      <circle cx="0" cy="0" r="62" fill="none"
              stroke="url(#ringStroke)" stroke-width="2.0"
              stroke-dasharray="2 6" opacity="0.85"/>
    </g>
    <!-- r=46, dash 14/6, opacity 1 — the boldest ring, the one a
         user reads first at thumbnail scale. -->
    <g transform="rotate(-48)">
      <circle cx="0" cy="0" r="46" fill="none"
              stroke="url(#ringStroke)" stroke-width="2.6"
              stroke-dasharray="14 6" opacity="1"/>
    </g>
    <!-- r=30, solid, mid opacity — soft inner halo. -->
    <circle cx="0" cy="0" r="30" fill="none"
            stroke="url(#ringStroke)" stroke-width="1.8" opacity="0.65"/>

    <!-- Centre node: violet glow + bright white core. The 'event
         horizon' that the rings spiral into. -->
    <circle cx="0" cy="0" r="20" fill="url(#coreGlow)" opacity="0.95"/>
    <circle cx="0" cy="0" r="8"  fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
